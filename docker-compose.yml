services:
  postgres:
    image: postgres:16-alpine
    container_name: kort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kort
      POSTGRES_PASSWORD: kort
      POSTGRES_DB: kort_db
      # Las imagenes alpine de Postgres no traen locales del sistema: sin esto
      # initdb puede quedar en locale "C" y romper el orden/comparacion de
      # texto con tildes/enie. UTF8 asegura que "ñ"/acentos se guarden y
      # comparen bien (Supabase en produccion ya es UTF8 por defecto).
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8'
    ports:
      - '5435:5432'
    volumes:
      - kort_postgres_data:/var/lib/postgresql/data

volumes:
  kort_postgres_data:
