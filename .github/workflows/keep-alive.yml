name: Keep backend awake

# Render (plan free) duerme el servicio despues de ~15 min sin trafico y
# tarda 30-50s en despertar en el primer request. Este workflow pega
# periodicamente a /api/health para que nunca llegue a dormirse.
#
# Para reconfigurar la URL sin tocar este archivo: Settings > Secrets and
# variables > Actions > Variables > crear "RENDER_HEALTH_URL" con el valor
# completo, ej. https://kort-backend.onrender.com/api/health.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://kort-backend.onrender.com/api/health' }}
        run: |
          echo "Pinging $HEALTH_URL"
          curl --fail --show-error --silent --max-time 55 "$HEALTH_URL"
